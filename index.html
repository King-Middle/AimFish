<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aim Fish — Ocean Clicker</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-rounded, "Avenir Next", Avenir, system-ui, sans-serif;
      background: #062b42;
      color: #effcff;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 110%, #147c86 0, transparent 53%),
        linear-gradient(160deg, #041e35, #0b425b 65%, #0c5862);
    }

    .game {
      width: 100%;
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #0c4860;
    }

    .topbar {
      flex: 0 0 auto;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 16px 25px;
      background: linear-gradient(100deg, #103d59, #12556a);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .brand-mark {
      width: 43px;
      height: 43px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: #ffcd73;
      font-size: 23px;
      box-shadow: 0 5px 15px rgb(255 190 94 / 20%);
    }

    h1 { margin: 0; font-size: 19px; letter-spacing: -.5px; }
    .subtitle { margin-top: 3px; color: #b6dce5; font-size: 12px; }

    .wallet {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 15px;
      border: 1px solid rgb(255 222 151 / 32%);
      border-radius: 14px;
      background: rgb(255 210 112 / 12%);
      color: #ffdc8d;
      font-size: 17px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .wallet span:first-child { font-size: 19px; }

    .scene-wrap {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
      touch-action: manipulation;
    }

    @media (max-width: 560px) {
      .topbar { min-height: 77px; padding: 13px 15px; }
      .brand-mark { width: 38px; height: 38px; border-radius: 13px; }
      h1 { font-size: 17px; }
      .subtitle { font-size: 11px; }
      .wallet { padding: 9px 11px; font-size: 15px; }
    }
  </style>
</head>
<body>
  <main class="game" aria-label="Aim Fish ocean clicker game">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">🐚</div>
        <div>
          <h1>Aim Fish</h1>
          <div class="subtitle">Practice aim by catching fishes</div>
        </div>
      </div>
      <div class="wallet" aria-label="Your money"><span id="money">$0.00</span></div>
    </header>
    <section class="scene-wrap" aria-label="Ocean game">
      <canvas id="ocean" aria-label="Click fish to collect money"></canvas>
    </section>
  </main>
  <script>
    (() => {
      const canvas = document.querySelector("#ocean");
      const ctx = canvas.getContext("2d");
      const moneyLabel = document.querySelector("#money");

      const hitboxScale = {
        fish: [1.2, .85],
        tetra: [1.2, .85],
        danio: [1.2, .85],
        harlequin: [1.2, .85],
        clownfish: [1.2, .85],
        mackerel: [1.2, .85],
        lionfish: [1.25, 1.15],
        parrotfish: [1.2, .85],
        koi: [1.2, .85],
        swordtail: [1.7, .85],
        goldfish: [1.7, 1.05],
        betta: [1.7, 1.1],
        angelfish: [1.1, 1],
        puffer: [1, .9],
        needlefish: [1.5, .45],
        seahorse: [.9, 1.1],
        jelly: [.9, 1.15],
        turtle: [1.1, 1],
        octopus: [1.05, 1.2],
        ray: [1.3, 1.15],
        whale: [1.3, 1.1],
        dolphin: [1.4, .95],
        shark: [1.3, 1],
        marlin: [1.4, .9],
        eel: [1.1, .8],
        sunfish: [1.1, 1.1],
        oarfish: [1.4, .45]
      };

      const species = [
        { name: "Guppy", level: 1, rarity: "Common", shape: "fish", color: "#ffbd69", fin: "#ed895f", size: 18, hp: 1, value: .10, weight: 34 },
        { name: "Neon tetra", level: 1, rarity: "Common", shape: "tetra", color: "#71d9ce", fin: "#3d9fc0", size: 18, hp: 1, value: .12, weight: 30 },
        { name: "Clownfish", level: 1, rarity: "Common", shape: "clownfish", color: "#ff9867", fin: "#ffd06e", size: 20, hp: 1, value: .16, weight: 26 },
        { name: "Cardinal tetra", level: 1, rarity: "Common", shape: "tetra", color: "#91aaff", fin: "#626cd1", size: 19, hp: 1, value: .14, weight: 24 },
        { name: "Zebra danio", level: 1, rarity: "Common", shape: "danio", color: "#87c9e8", fin: "#6784c9", size: 19, hp: 1, value: .16, weight: 18 },
        { name: "Harlequin rasbora", level: 1, rarity: "Common", shape: "harlequin", color: "#f6a66f", fin: "#cf6374", size: 19, hp: 1, value: .18, weight: 15 },
        { name: "Cherry barb", level: 1, rarity: "Common", shape: "fish", color: "#e87980", fin: "#a84d69", size: 18, hp: 1, value: .14, weight: 15 },
        { name: "Molly", level: 1, rarity: "Common", shape: "fish", color: "#5c657b", fin: "#f2c56f", size: 20, hp: 1, value: .16, weight: 13 },
        { name: "Damselfish", level: 1, rarity: "Common", shape: "fish", color: "#70e0ca", fin: "#39bcae", size: 20, hp: 1, value: .15, weight: 24 },
        { name: "Blue jellyfish", level: 1, rarity: "Common", shape: "jelly", color: "#8fe7ef", fin: "#62b8db", size: 22, hp: 1, value: .20, weight: 9 },
        { name: "Fancy goldfish", level: 1, rarity: "Common", shape: "goldfish", color: "#ffad5c", fin: "#f27868", size: 21, hp: 1, value: .22, weight: 20 },
        { name: "Swordtail", level: 1, rarity: "Common", shape: "swordtail", color: "#8fda86", fin: "#4fae8a", size: 20, hp: 1, value: .18, weight: 18 },
        { name: "Betta", level: 1, rarity: "Common", shape: "betta", color: "#bc9aff", fin: "#ed78bb", size: 21, hp: 1, value: .25, weight: 15 },
        { name: "Butterflyfish", level: 1, rarity: "Common", shape: "angelfish", color: "#ffe180", fin: "#ed9e64", size: 21, hp: 1, value: .24, weight: 15 },
        { name: "Pea puffer", level: 1, rarity: "Common", shape: "puffer", color: "#a9d77a", fin: "#6da968", size: 18, hp: 1, value: .20, weight: 12 },
        { name: "Seahorse", level: 1, rarity: "Common", shape: "seahorse", color: "#ffa77e", fin: "#dd785f", size: 22, hp: 1, value: .30, weight: 13 },
        { name: "Speedy needlefish", level: 1, rarity: "Rare", shape: "needlefish", color: "#d5e5e9", fin: "#789eb1", size: 20, hp: 1, value: 5, weight: 0, fixedSpeed: 190, rareDash: true },
        { name: "Leafy seadragon", level: 2, rarity: "Rare", shape: "seahorse", color: "#9ccd84", fin: "#d8ad67", size: 38, hp: 3, value: 8, weight: .7 },
        { name: "Yellow tang", level: 1, rarity: "Uncommon", shape: "angelfish", color: "#ffe477", fin: "#edaa53", size: 22, hp: 2, value: .35, weight: 8 },
        { name: "Star guppy", level: 1, rarity: "Rare", shape: "fish", color: "#fff18a", fin: "#f7b757", size: 20, hp: 2, value: 4, weight: .08, bonus: true },
        { name: "Royal betta", level: 1, rarity: "Rare", shape: "betta", color: "#fa9be2", fin: "#a87be8", size: 22, hp: 2, value: 6, weight: .04, bonus: true },
        { name: "Blue tang", level: 2, rarity: "Uncommon", shape: "angelfish", color: "#76c6ff", fin: "#6285ed", size: 34, hp: 2, value: .8, weight: 5 },
        { name: "Koi carp", level: 2, rarity: "Uncommon", shape: "koi", color: "#f9a2db", fin: "#ffca7b", size: 35, hp: 2, value: 1.2, weight: 4 },
        { name: "Lionfish", level: 2, rarity: "Rare", shape: "lionfish", color: "#ffb27b", fin: "#e7756d", size: 38, hp: 3, value: 3.2, weight: 1.5 },
        { name: "Parrotfish", level: 2, rarity: "Rare", shape: "parrotfish", color: "#66d9ad", fin: "#f28a78", size: 39, hp: 3, value: 3.7, weight: 1.3 },
        { name: "Moray eel", level: 2, rarity: "Rare", shape: "eel", color: "#9cb96f", fin: "#627b56", size: 41, hp: 3, value: 4.2, weight: 1 },
        { name: "Stingray", level: 2, rarity: "Rare", shape: "ray", color: "#d69bca", fin: "#a96e9f", size: 40, hp: 3, value: 5, weight: .8 },
        { name: "Green sea turtle", level: 2, rarity: "Rare", shape: "turtle", color: "#a8cf83", fin: "#72a769", size: 43, hp: 3, value: 5.5, weight: .7 },
        { name: "Common octopus", level: 2, rarity: "Rare", shape: "octopus", color: "#dd8eb1", fin: "#ad658a", size: 40, hp: 3, value: 6, weight: .6 },
        { name: "Moon jellyfish", level: 2, rarity: "Rare", shape: "jelly", color: "#f2a9eb", fin: "#c780e2", size: 38, hp: 3, value: 7, weight: .5 },
        { name: "Angelfish", level: 2, rarity: "Rare", shape: "angelfish", color: "#9ac8ff", fin: "#7565cc", size: 37, hp: 3, value: 5.5, weight: .7 },
        { name: "Hammerhead shark", level: 3, rarity: "Rare", shape: "shark", color: "#a9c5d4", fin: "#718fa4", size: 52, hp: 4, value: 12, weight: .7 },
        { name: "Barracuda", level: 3, rarity: "Rare", shape: "shark", color: "#9cc9bc", fin: "#568d83", size: 54, hp: 4, value: 14, weight: .55 },
        { name: "Bluefin tuna", level: 3, rarity: "Rare", shape: "mackerel", color: "#85b8d5", fin: "#587aa5", size: 55, hp: 4, value: 17, weight: .45 },
        { name: "Blue marlin", level: 3, rarity: "Rare", shape: "marlin", color: "#82baff", fin: "#547ed1", size: 59, hp: 4, value: 21, weight: .35 },
        { name: "Bottlenose dolphin", level: 3, rarity: "Rare", shape: "dolphin", color: "#9db8ce", fin: "#718fa4", size: 60, hp: 4, value: 25, weight: .27 },
        { name: "Lion's mane jellyfish", level: 3, rarity: "Legendary", shape: "jelly", color: "#f3a5be", fin: "#cf6588", size: 58, hp: 5, value: 48, weight: .04, bonus: true },
        { name: "Great white shark", level: 3, rarity: "Legendary", shape: "shark", color: "#e0e6ff", fin: "#a7aae9", size: 61, hp: 5, value: 58, weight: .015, bonus: true },
        { name: "Golden koi", level: 3, rarity: "Legendary", shape: "koi", color: "#ffe58b", fin: "#e8aa58", size: 53, hp: 4, value: 72, weight: .01, bonus: true },
        { name: "Whale shark", level: 4, rarity: "Legendary", shape: "shark", color: "#86b6c4", fin: "#537b91", size: 72, hp: 6, value: 60, weight: .15 },
        { name: "Ocean sunfish", level: 4, rarity: "Legendary", shape: "sunfish", color: "#b3a5ce", fin: "#85799f", size: 70, hp: 6, value: 75, weight: .13 },
        { name: "Oarfish", level: 4, rarity: "Legendary", shape: "oarfish", color: "#e895a3", fin: "#c65f7e", size: 73, hp: 6, value: 90, weight: .11 },
        { name: "Basking shark", level: 4, rarity: "Legendary", shape: "shark", color: "#96adba", fin: "#667f8b", size: 78, hp: 7, value: 112, weight: .09 },
        { name: "Humpback whale", level: 4, rarity: "Legendary", shape: "whale", color: "#86d9d4", fin: "#549dab", size: 82, hp: 7, value: 138, weight: .07 },
        { name: "Blue whale", level: 4, rarity: "Legendary", shape: "whale", color: "#c0adff", fin: "#877ad7", size: 92, hp: 8, value: 240, weight: .01, bonus: true }
      ];

      let width = 0;
      let height = 0;
      let pixelRatio = 1;
      let fish = [];
      let bubbles = [];
      let particles = [];
      let rewards = [];
      let money = 0;
      let caught = 0;
      let nextId = 0;
      let lastTime = 0;

      function resize() {
        const rect = canvas.getBoundingClientRect();
        pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        width = rect.width;
        height = rect.height;
        canvas.width = Math.round(width * pixelRatio);
        canvas.height = Math.round(height * pixelRatio);
        ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
        bubbles = Array.from({ length: Math.ceil(width / 34) }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          r: 1 + Math.random() * 3,
          speed: 8 + Math.random() * 22,
          drift: (Math.random() - .5) * 9
        }));
      }

      function chooseSpecies() {
        const speedyNeedlefish = species.find(s => s.rareDash);
        if (Math.random() < .01) return speedyNeedlefish;
        let eligible = species.filter(s => !s.rareDash);
        if (caught < 4) eligible = eligible.filter(s => s.level === 1);
        else if (caught < 10) eligible = eligible.filter(s => s.level <= 2);
        else if (caught < 19) eligible = eligible.filter(s => s.level <= 3);
        const total = eligible.reduce((sum, item) => sum + item.weight, 0);
        let pick = Math.random() * total;
        for (const item of eligible) {
          pick -= item.weight;
          if (pick <= 0) return item;
        }
        return eligible[0];
      }

      function addFish() {
        if (fish.length >= 30) return;
        const kind = chooseSpecies();
        const fromLeft = Math.random() < .5;
        const speed = kind.fixedSpeed || 27 + Math.random() * 110 + kind.level * 5;
        fish.push({
          id: nextId++,
          kind,
          x: fromLeft ? -kind.size - 15 : width + kind.size + 15,
          y: height * (.2 + Math.random() * .68),
          direction: fromLeft ? 1 : -1,
          speed,
          phase: Math.random() * Math.PI * 2,
          amplitude: 10 + Math.random() * 30,
          frequency: .5 + Math.random() * 1.15,
          verticalPhase: Math.random() * Math.PI * 2,
          verticalAmplitude: 26 + Math.random() * 48,
          verticalFrequency: .55 + Math.random() * .8,
          drift: (Math.random() - .5) * 12,
          age: 0,
          hp: kind.hp,
          wobble: Math.random() * Math.PI * 2
        });
      }

      function drawFish(item, time) {
        const k = item.kind;
        const scale = k.size / 26;
        const wiggle = Math.sin(time * 7 * item.frequency + item.wobble) * 2.4 * scale;
        const facing = item.direction;
        ctx.save();
        ctx.translate(item.x, item.y);
        ctx.scale(facing * scale, scale);

        if (k.bonus) {
          ctx.save();
          ctx.globalAlpha = .22 + Math.sin(time * 3 + item.wobble) * .08;
          ctx.strokeStyle = k.color;
          ctx.lineWidth = 1.5 / scale;
          ctx.beginPath();
          ctx.ellipse(0, 0, 32, 22, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        const body = ctx.createLinearGradient(0, -16, 0, 16);
        body.addColorStop(0, lighten(k.color, 28));
        body.addColorStop(1, k.color);
        const fillBody = path => {
          ctx.fillStyle = body;
          ctx.beginPath();
          path();
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = "rgb(255 255 255 / 38%)";
          ctx.lineWidth = 1;
          ctx.stroke();
        };
        const fillFin = path => {
          ctx.fillStyle = k.fin;
          ctx.beginPath();
          path();
          ctx.closePath();
          ctx.fill();
        };
        const eye = (x, y, radius = 1.8) => {
          ctx.fillStyle = "#12374c";
          ctx.beginPath();
          ctx.arc(x, y, radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#fff";
          ctx.beginPath();
          ctx.arc(x + .5, y - .6, radius * .35, 0, Math.PI * 2);
          ctx.fill();
        };
        const ellipseBody = (rx, ry) => fillBody(() => ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2));
        const drawFishShape = () => {
          if (k.shape === "swordtail") {
            fillFin(() => { ctx.moveTo(-16, 0); ctx.lineTo(-37 - wiggle, -15); ctx.lineTo(-25, -2); ctx.lineTo(-42 - wiggle, -1); ctx.lineTo(-16, 1); });
            fillFin(() => { ctx.moveTo(-16, 0); ctx.lineTo(-37 - wiggle, 15); ctx.lineTo(-25, 2); });
          } else if (k.shape === "goldfish") {
            fillFin(() => { ctx.moveTo(-14, 0); ctx.quadraticCurveTo(-31, -21 - wiggle, -34, -9); ctx.quadraticCurveTo(-42, 0, -32, 10); ctx.quadraticCurveTo(-27, 18 + wiggle, -14, 0); });
          } else if (k.shape === "betta") {
            fillFin(() => { ctx.moveTo(-15, 0); ctx.quadraticCurveTo(-28, -22 - wiggle, -38, -17); ctx.quadraticCurveTo(-34, 0, -38, 17); ctx.quadraticCurveTo(-26, 22 + wiggle, -15, 0); });
            fillFin(() => { ctx.moveTo(-5, -8); ctx.quadraticCurveTo(-12, -22, 3, -19); ctx.lineTo(9, -9); });
            fillFin(() => { ctx.moveTo(-4, 8); ctx.quadraticCurveTo(-11, 20, 4, 18); ctx.lineTo(8, 9); });
          } else {
            fillFin(() => { ctx.moveTo(-14, 0); ctx.lineTo(-29 - wiggle, -12); ctx.lineTo(-26 - wiggle, 12); });
            fillFin(() => { ctx.moveTo(-3, -8); ctx.lineTo(-10, -19 + wiggle * .45); ctx.lineTo(8, -9); });
            fillFin(() => { ctx.moveTo(-4, 8); ctx.lineTo(-11, 16 - wiggle * .35); ctx.lineTo(7, 9); });
          }
          fillBody(() => {
            ctx.moveTo(-18, 0);
            ctx.quadraticCurveTo(-14, -11, 0, -11);
            ctx.quadraticCurveTo(13, -10, 20, -1);
            ctx.quadraticCurveTo(21, 0, 18, 2);
            ctx.quadraticCurveTo(9, 10, -2, 10);
            ctx.quadraticCurveTo(-14, 9, -18, 0);
          });
          if (k.shape === "tetra" || k.shape === "mackerel" || k.shape === "danio") {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(-18, 0);
            ctx.quadraticCurveTo(-14, -11, 0, -11);
            ctx.quadraticCurveTo(13, -10, 20, -1);
            ctx.quadraticCurveTo(21, 0, 18, 2);
            ctx.quadraticCurveTo(9, 10, -2, 10);
            ctx.quadraticCurveTo(-14, 9, -18, 0);
            ctx.clip();
            if (k.shape === "tetra") {
              ctx.fillStyle = "#316a9b";
              ctx.fillRect(-10, -3, 29, 2);
              ctx.fillStyle = "#ef6478";
              ctx.fillRect(-13, 2, 34, 3);
            } else if (k.shape === "danio") {
              ctx.strokeStyle = "rgb(43 64 92 / 75%)";
              ctx.lineWidth = 1.5;
              for (const y of [-6, -2, 2, 6]) {
                ctx.beginPath(); ctx.moveTo(-14, y); ctx.lineTo(17, y); ctx.stroke();
              }
            } else {
              ctx.strokeStyle = "rgb(36 57 81 / 65%)";
              ctx.lineWidth = 2;
              for (let x = -10; x < 17; x += 6) {
                ctx.beginPath(); ctx.moveTo(x, -11); ctx.lineTo(x - 4, -2); ctx.stroke();
              }
            }
            ctx.restore();
          } else if (k.shape === "clownfish" || k.shape === "koi" || k.shape === "lionfish") {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(-18, 0);
            ctx.quadraticCurveTo(-14, -11, 0, -11);
            ctx.quadraticCurveTo(13, -10, 20, -1);
            ctx.quadraticCurveTo(21, 0, 18, 2);
            ctx.quadraticCurveTo(9, 10, -2, 10);
            ctx.quadraticCurveTo(-14, 9, -18, 0);
            ctx.clip();
            ctx.fillStyle = k.shape === "koi" ? "#fff2df" : "#fff3dc";
            if (k.shape === "koi") {
              ctx.fillRect(-2, -13, 11, 26);
              ctx.fillRect(12, -12, 8, 24);
              ctx.fillStyle = k.color;
              ctx.beginPath(); ctx.ellipse(-8, -3, 5, 6, .3, 0, Math.PI * 2); ctx.fill();
            } else {
              for (const stripeX of [-7, 2, 11]) ctx.fillRect(stripeX - 2, -13, 4, 26);
            }
            if (k.shape === "lionfish") {
              ctx.fillStyle = k.color;
              for (const stripeX of [-3, 7]) ctx.fillRect(stripeX, -13, 4, 26);
            }
            ctx.restore();
            ctx.strokeStyle = "rgb(47 51 66 / 65%)";
            ctx.lineWidth = 1.3;
            for (const stripeX of k.shape === "koi" ? [-2, 9, 12] : [-7, 2, 11]) {
              ctx.beginPath(); ctx.moveTo(stripeX, -10); ctx.lineTo(stripeX, 10); ctx.stroke();
            }
          }
          if (k.shape === "harlequin") {
            ctx.fillStyle = "#783f4f";
            ctx.beginPath(); ctx.moveTo(-17, -8); ctx.lineTo(-2, 0); ctx.lineTo(-17, 8); ctx.closePath(); ctx.fill();
          }
          if (k.shape === "parrotfish") {
            ctx.fillStyle = k.fin;
            ctx.beginPath(); ctx.arc(17, 0, 4, -.9, .9); ctx.fill();
            ctx.strokeStyle = "rgb(255 255 255 / 55%)";
            for (let i = 0; i < 3; i++) {
              ctx.beginPath(); ctx.arc(-3 + i * 5, 1, 2, 0, Math.PI); ctx.stroke();
            }
          }
          eye(10, -2, 1.8);
        };

        switch (k.shape) {
          case "jelly":
            fillBody(() => {
              ctx.moveTo(-17, 0);
              ctx.quadraticCurveTo(-20, -20, 0, -21);
              ctx.quadraticCurveTo(20, -20, 17, 0);
              ctx.quadraticCurveTo(12, 6, 6, 1);
              ctx.quadraticCurveTo(0, 7, -6, 1);
              ctx.quadraticCurveTo(-12, 7, -17, 0);
            });
            ctx.strokeStyle = k.fin;
            ctx.lineWidth = 2;
            for (let i = -2; i <= 2; i++) {
              const startX = i * 6;
              ctx.beginPath();
              ctx.moveTo(startX, 2);
              ctx.bezierCurveTo(startX + wiggle, 9, startX - wiggle, 17, startX + Math.sin(time * 4 + i) * 4, 25);
              ctx.stroke();
            }
            ctx.fillStyle = "rgb(255 255 255 / 45%)";
            ctx.beginPath(); ctx.arc(-6, -12, 2, 0, Math.PI * 2); ctx.arc(3, -15, 2, 0, Math.PI * 2); ctx.fill();
            break;
          case "seahorse":
            fillFin(() => {
              ctx.moveTo(-2, -2); ctx.lineTo(-16, -13); ctx.lineTo(-10, 1); ctx.lineTo(-15, 12); ctx.lineTo(-2, 7);
            });
            fillBody(() => {
              ctx.moveTo(0, -17);
              ctx.quadraticCurveTo(13, -20, 12, -9);
              ctx.lineTo(19, -7); ctx.lineTo(13, -4);
              ctx.quadraticCurveTo(16, 5, 5, 8);
              ctx.quadraticCurveTo(7, 16, -1, 16);
              ctx.quadraticCurveTo(-12, 17, -8, 10);
              ctx.quadraticCurveTo(-5, 7, 0, 10);
              ctx.quadraticCurveTo(-4, 3, -4, -4);
              ctx.quadraticCurveTo(-13, -10, -6, -16);
            });
            ctx.strokeStyle = k.fin;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-7, 10);
            ctx.bezierCurveTo(-17, 7, -15, 21, -6, 20);
            ctx.bezierCurveTo(2, 19, -2, 11, -7, 14);
            ctx.stroke();
            for (let i = 0; i < 4; i++) {
              const finX = -7 - i * 2;
              ctx.beginPath();
              ctx.moveTo(finX, -7 + i * 4);
              ctx.lineTo(finX - 4, -5 + i * 4 + wiggle * .2);
              ctx.stroke();
            }
            eye(9, -13, 1.5);
            break;
          case "needlefish":
            fillFin(() => { ctx.moveTo(-20, 0); ctx.lineTo(-29, -7); ctx.lineTo(-27, 0); ctx.lineTo(-29, 7); });
            fillFin(() => { ctx.moveTo(-5, -4); ctx.lineTo(-8, -10); ctx.lineTo(1, -4); });
            fillFin(() => { ctx.moveTo(-5, 4); ctx.lineTo(-8, 9); ctx.lineTo(1, 4); });
            fillBody(() => {
              ctx.moveTo(-20, -2);
              ctx.quadraticCurveTo(-10, -7, 7, -4);
              ctx.lineTo(38, -1);
              ctx.lineTo(8, 1);
              ctx.quadraticCurveTo(-10, 5, -20, 2);
            });
            ctx.strokeStyle = "rgb(43 75 91 / 72%)";
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(38, -1); ctx.stroke();
            eye(5, -2, 1.5);
            break;
          case "ray":
            fillFin(() => {
              ctx.moveTo(-11, 3); ctx.quadraticCurveTo(-27, -4, -32, -19);
              ctx.quadraticCurveTo(-20, -14, -5, -8); ctx.quadraticCurveTo(8, -19, 31, -18);
              ctx.quadraticCurveTo(27, -4, 11, 3); ctx.lineTo(2, 12);
              ctx.lineTo(-2, 27); ctx.lineTo(-5, 12);
            });
            fillBody(() => {
              ctx.moveTo(-13, 0); ctx.quadraticCurveTo(0, -10, 13, 0);
              ctx.quadraticCurveTo(3, 11, -3, 11); ctx.quadraticCurveTo(-10, 9, -13, 0);
            });
            eye(5, -1, 1.4);
            break;
          case "turtle":
            fillFin(() => {
              ctx.moveTo(-11, 5); ctx.quadraticCurveTo(-19, 9, -23, 17 + wiggle);
              ctx.quadraticCurveTo(-13, 16, -6, 8);
            });
            fillFin(() => {
              ctx.moveTo(8, 5); ctx.quadraticCurveTo(14, 12, 17, 19 - wiggle);
              ctx.quadraticCurveTo(24, 15, 17, 7);
            });
            ctx.fillStyle = body;
            ctx.beginPath();
            ctx.moveTo(-20, 4);
            ctx.quadraticCurveTo(-17, -3, -5, -4);
            ctx.quadraticCurveTo(4, -5, 13, -2);
            ctx.quadraticCurveTo(19, 0, 21, 4);
            ctx.lineTo(18, 9);
            ctx.quadraticCurveTo(-1, 13, -19, 9);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = k.fin;
            ctx.beginPath();
            ctx.moveTo(-15, 3);
            ctx.quadraticCurveTo(-13, -12, 0, -14);
            ctx.quadraticCurveTo(14, -14, 15, 3);
            ctx.quadraticCurveTo(0, 7, -15, 3);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = "rgb(43 76 57 / 70%)";
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(-8, -8); ctx.quadraticCurveTo(-4, -1, -8, 4);
            ctx.moveTo(0, -13); ctx.lineTo(0, 5);
            ctx.moveTo(8, -8); ctx.quadraticCurveTo(5, -1, 9, 4);
            ctx.stroke();
            ctx.fillStyle = body;
            ctx.beginPath(); ctx.ellipse(23, 2, 8, 6, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = k.fin;
            ctx.beginPath();
            ctx.moveTo(2, 7); ctx.quadraticCurveTo(8, 9, 10, 17 + wiggle);
            ctx.quadraticCurveTo(16, 15, 13, 7);
            ctx.closePath();
            ctx.fill();
            eye(26, 0, 1.4);
            break;
          case "octopus":
            ctx.strokeStyle = k.fin;
            ctx.lineWidth = 3;
            ctx.lineCap = "round";
            for (let i = 0; i < 8; i++) {
              const startX = -11 + i * 3;
              const endX = startX + (i - 3.5) * 3 + Math.sin(time * 4 + i) * 3;
              ctx.beginPath();
              ctx.moveTo(startX, 8);
              ctx.bezierCurveTo(startX - 6, 15 + wiggle, endX + 6, 17 - wiggle, endX, 25 + (i % 3) * 2);
              ctx.stroke();
            }
            fillBody(() => {
              ctx.moveTo(-14, 4);
              ctx.quadraticCurveTo(-15, -10, -5, -12);
              ctx.quadraticCurveTo(0, -25, 8, -14);
              ctx.quadraticCurveTo(18, -10, 14, 4);
              ctx.quadraticCurveTo(0, 12, -14, 4);
            });
            eye(7, -5, 1.5);
            eye(13, -4, 1.5);
            break;
          case "whale":
            fillFin(() => {
              ctx.moveTo(-19, 0); ctx.lineTo(-31, -11 - wiggle); ctx.quadraticCurveTo(-27, -1, -32, 0);
              ctx.quadraticCurveTo(-27, 1, -31, 11 + wiggle); ctx.lineTo(-19, 0);
            });
            fillFin(() => { ctx.moveTo(-4, -12); ctx.lineTo(0, -19); ctx.lineTo(6, -12); });
            ellipseBody(25, 15);
            fillFin(() => { ctx.moveTo(2, 8); ctx.quadraticCurveTo(14, 8, 17, 19); ctx.quadraticCurveTo(5, 18, 0, 12); });
            ctx.fillStyle = "rgb(255 255 255 / 64%)";
            ctx.beginPath(); ctx.ellipse(8, 10, 9, 3, .15, 0, Math.PI * 2); ctx.fill();
            eye(17, -3, 1.6);
            ctx.strokeStyle = "rgb(220 255 255 / 80%)";
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(0, -17); ctx.quadraticCurveTo(-2, -24, 2, -27); ctx.stroke();
            break;
          case "dolphin":
            fillFin(() => {
              ctx.moveTo(-20, 0); ctx.lineTo(-32, -11 - wiggle); ctx.quadraticCurveTo(-28, -1, -33, 0);
              ctx.quadraticCurveTo(-28, 1, -32, 11 + wiggle); ctx.lineTo(-20, 0);
            });
            fillFin(() => { ctx.moveTo(-2, -9); ctx.lineTo(3, -20); ctx.lineTo(9, -9); });
            fillFin(() => { ctx.moveTo(-1, 7); ctx.quadraticCurveTo(9, 7, 14, 16); ctx.quadraticCurveTo(4, 14, -3, 10); });
            fillBody(() => {
              ctx.moveTo(-27, 0);
              ctx.quadraticCurveTo(-14, -14, 5, -12);
              ctx.quadraticCurveTo(17, -11, 23, -5);
              ctx.lineTo(34, -3); ctx.lineTo(24, 1);
              ctx.quadraticCurveTo(14, 11, -5, 10);
              ctx.quadraticCurveTo(-19, 8, -27, 0);
            });
            ctx.fillStyle = "rgb(255 255 255 / 70%)";
            ctx.beginPath(); ctx.ellipse(8, 7, 12, 3, 0, 0, Math.PI * 2); ctx.fill();
            eye(19, -4, 1.5);
            break;
          case "shark":
          case "marlin":
            fillFin(() => {
              ctx.moveTo(-17, 0); ctx.lineTo(-31, -11 - wiggle); ctx.lineTo(-27, 0);
              ctx.lineTo(-31, 11 + wiggle); ctx.lineTo(-17, 0);
            });
            fillFin(() => { ctx.moveTo(-2, -9); ctx.lineTo(3, -23); ctx.lineTo(10, -10); });
            fillFin(() => { ctx.moveTo(-6, 9); ctx.lineTo(-12, 17); ctx.lineTo(2, 10); });
            if (k.shape === "marlin") {
              fillBody(() => {
                ctx.moveTo(-25, 0); ctx.lineTo(-5, -7); ctx.lineTo(22, -5);
                ctx.lineTo(38, -2); ctx.lineTo(23, 1); ctx.quadraticCurveTo(3, 11, -25, 0);
              });
            } else {
              fillBody(() => {
                ctx.moveTo(-26, 0); ctx.quadraticCurveTo(-13, -13, 10, -10);
                ctx.quadraticCurveTo(22, -9, 28, -2); ctx.lineTo(24, 2);
                ctx.quadraticCurveTo(6, 11, -26, 0);
              });
            }
            ctx.strokeStyle = "rgb(29 55 74 / 60%)";
            ctx.lineWidth = 1;
            for (let i = 0; i < 3; i++) {
              ctx.beginPath(); ctx.moveTo(7 + i * 4, 0); ctx.lineTo(5 + i * 4, 6); ctx.stroke();
            }
            eye(18, -3, 1.5);
            break;
          case "puffer":
            fillFin(() => { ctx.moveTo(-11, -4); ctx.lineTo(-22, -12); ctx.lineTo(-20, 4); });
            fillFin(() => { ctx.moveTo(8, 4); ctx.lineTo(18, 13); ctx.lineTo(8, 10); });
            for (let i = 0; i < 10; i++) {
              const a = i * Math.PI * 2 / 10;
              fillFin(() => {
                ctx.moveTo(Math.cos(a) * 16, Math.sin(a) * 12);
                ctx.lineTo(Math.cos(a) * 22, Math.sin(a) * 17);
                ctx.lineTo(Math.cos(a + .28) * 16, Math.sin(a + .28) * 12);
              });
            }
            ellipseBody(17, 14);
            eye(9, -3, 1.7);
            ctx.fillStyle = "#12374c";
            ctx.beginPath(); ctx.arc(15, 3, 1.3, 0, Math.PI * 2); ctx.fill();
            break;
          case "eel":
            fillFin(() => {
              ctx.moveTo(-28, -1);
              ctx.bezierCurveTo(-19, -16, -10, 7, -1, -2);
              ctx.bezierCurveTo(9, -13, 16, 3, 26, -4);
              ctx.lineTo(25, 0);
              ctx.bezierCurveTo(14, 9, 8, -3, -1, 3);
              ctx.bezierCurveTo(-12, 13, -20, -4, -28, 2);
            });
            fillBody(() => {
              ctx.moveTo(-27, 0);
              ctx.bezierCurveTo(-18, -9, -10, 6, -1, -1);
              ctx.bezierCurveTo(8, -8, 16, 4, 25, -3);
              ctx.lineTo(25, 2);
              ctx.bezierCurveTo(16, 11, 8, -4, -1, 4);
              ctx.bezierCurveTo(-11, 11, -19, -4, -27, 2);
            });
            ctx.strokeStyle = "rgb(36 57 42 / 65%)";
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(20, -1); ctx.lineTo(25, 0); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(16, -3); ctx.lineTo(15, 3); ctx.stroke();
            eye(17, -1, 1.5);
            break;
          case "sunfish":
            fillFin(() => { ctx.moveTo(-8, -12); ctx.lineTo(-2, -26); ctx.lineTo(7, -12); });
            fillFin(() => { ctx.moveTo(-8, 12); ctx.lineTo(-2, 25); ctx.lineTo(7, 12); });
            fillFin(() => { ctx.moveTo(-16, -3); ctx.lineTo(-24, -9); ctx.lineTo(-22, 8); });
            fillBody(() => {
              ctx.moveTo(-17, -2); ctx.quadraticCurveTo(-10, -17, 8, -13);
              ctx.quadraticCurveTo(20, -8, 18, 1); ctx.quadraticCurveTo(13, 15, -5, 15);
              ctx.quadraticCurveTo(-15, 12, -17, -2);
            });
            eye(12, -4, 1.7);
            break;
          case "oarfish":
            fillBody(() => {
              ctx.moveTo(-31, 0); ctx.quadraticCurveTo(-16, -6, 0, -4);
              ctx.quadraticCurveTo(20, -3, 33, 0); ctx.quadraticCurveTo(18, 5, 0, 4);
              ctx.quadraticCurveTo(-18, 6, -31, 0);
            });
            ctx.strokeStyle = k.fin;
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(-28, -1);
            for (let x = -26; x <= 29; x += 3) ctx.lineTo(x, -5 - Math.sin((x + 26) * .2) * 3);
            ctx.stroke();
            eye(28, -1, 1.3);
            break;
          case "angelfish":
            fillFin(() => {
              ctx.moveTo(-13, -6); ctx.lineTo(-5, -22); ctx.lineTo(5, -8);
              ctx.lineTo(5, 8); ctx.lineTo(-5, 22); ctx.lineTo(-13, 6);
            });
            fillFin(() => { ctx.moveTo(-14, 0); ctx.lineTo(-26, -8); ctx.lineTo(-24, 8); });
            fillBody(() => {
              ctx.moveTo(-15, 0); ctx.quadraticCurveTo(-11, -12, 5, -11);
              ctx.quadraticCurveTo(20, -10, 20, 0); ctx.quadraticCurveTo(18, 11, 4, 11);
              ctx.quadraticCurveTo(-10, 11, -15, 0);
            });
            ctx.strokeStyle = k.fin;
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(-7, -10); ctx.lineTo(-7, 10); ctx.moveTo(2, -10); ctx.lineTo(2, 10); ctx.stroke();
            eye(13, -3, 1.6);
            break;
          case "lionfish":
            for (let i = -3; i <= 3; i++) {
              ctx.strokeStyle = k.fin;
              ctx.lineWidth = 1.5;
              ctx.beginPath(); ctx.moveTo(i * 5, -6); ctx.lineTo(i * 7 - 4, -22 - Math.abs(i % 2) * 4); ctx.stroke();
            }
            drawFishShape();
            break;
          case "koi":
            drawFishShape();
            ctx.fillStyle = "#f36f72";
            ctx.beginPath(); ctx.arc(-6, -2, 3, 0, Math.PI * 2); ctx.fill();
            break;
          default:
            drawFishShape();
        }

        ctx.restore();

        if (k.hp > 1) {
          const barWidth = Math.max(20, k.size * .56);
          const barY = item.y - k.size * .55 - 8;
          ctx.fillStyle = "rgb(1 29 47 / 50%)";
          roundRect(ctx, item.x - barWidth / 2, barY, barWidth, 4, 3);
          ctx.fill();
          ctx.fillStyle = k.bonus ? "#ffe58b" : "#b6f4e3";
          roundRect(ctx, item.x - barWidth / 2, barY, barWidth * item.hp / k.hp, 4, 3);
          ctx.fill();
        }

        if (k.bonus) {
          ctx.fillStyle = "#fff1a7";
          ctx.font = "11px system-ui";
          ctx.textAlign = "center";
          ctx.fillText("✦", item.x, item.y - k.size * .55 - 12);
        }
      }

      function lighten(hex, amount) {
        const value = Number.parseInt(hex.slice(1), 16);
        const r = Math.min(255, (value >> 16) + amount);
        const g = Math.min(255, ((value >> 8) & 255) + amount);
        const b = Math.min(255, (value & 255) + amount);
        return `rgb(${r}, ${g}, ${b})`;
      }

      function roundRect(context, x, y, w, h, r) {
        context.beginPath();
        context.roundRect(x, y, w, h, r);
      }

      function drawBackground(time, dt) {
        const sky = ctx.createLinearGradient(0, 0, 0, height);
        sky.addColorStop(0, "#55c8d0");
        sky.addColorStop(.14, "#2499b0");
        sky.addColorStop(.52, "#08718e");
        sky.addColorStop(1, "#06415f");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, width, height);

        const glow = ctx.createRadialGradient(width * .78, height * .08, 8, width * .78, height * .08, height * .72);
        glow.addColorStop(0, "rgb(255 228 154 / 30%)");
        glow.addColorStop(1, "rgb(255 228 154 / 0%)");
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, width, height);

        ctx.fillStyle = "rgb(191 250 237 / 10%)";
        ctx.beginPath();
        ctx.moveTo(0, height * .17);
        for (let x = 0; x <= width + 10; x += 10) {
          ctx.lineTo(x, height * .17 + Math.sin(x * .014 + time * .9) * 3);
        }
        ctx.lineTo(width, height * .2);
        ctx.lineTo(0, height * .2);
        ctx.closePath();
        ctx.fill();

        for (const bubble of bubbles) {
          bubble.y -= bubble.speed * dt;
          bubble.x += Math.sin(time + bubble.y * .015) * bubble.drift * dt;
          if (bubble.y < -8) { bubble.y = height + 8; bubble.x = Math.random() * width; }
          ctx.strokeStyle = "rgb(218 255 255 / 28%)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(bubble.x, bubble.y, bubble.r, 0, Math.PI * 2);
          ctx.stroke();
          ctx.fillStyle = "rgb(255 255 255 / 20%)";
          ctx.fillRect(bubble.x - bubble.r * .4, bubble.y - bubble.r * .45, 1, 1);
        }

        const floor = ctx.createLinearGradient(0, height * .83, 0, height);
        floor.addColorStop(0, "rgb(14 91 103 / 0%)");
        floor.addColorStop(1, "rgb(11 89 87 / 52%)");
        ctx.fillStyle = floor;
        ctx.fillRect(0, height * .83, width, height * .17);
        const seabed = ctx.createLinearGradient(0, height * .92, 0, height);
        seabed.addColorStop(0, "rgb(96 135 105 / 18%)");
        seabed.addColorStop(1, "rgb(151 143 96 / 38%)");
        ctx.fillStyle = seabed;
        ctx.beginPath();
        ctx.moveTo(0, height * .96);
        for (let x = 0; x <= width; x += 16) {
          ctx.lineTo(x, height * .95 + Math.sin(x * .018) * 5);
        }
        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        ctx.closePath();
        ctx.fill();

        const grassCount = Math.ceil(width / 25);
        for (let i = 0; i < grassCount; i++) {
          const x = (i / Math.max(1, grassCount - 1)) * width;
          const sway = Math.sin(time * 1.1 + i * 1.7) * 8;
          const base = height + 5;
          const heightBase = 32 + (i * 29 % 48);
          const color = i % 3 === 0 ? "#458d71" : i % 3 === 1 ? "#55a276" : "#6b9b66";

          for (let blade = -1; blade <= 1; blade++) {
            const offset = blade * 5;
            const bladeHeight = heightBase + ((i + blade * 3) % 4) * 7;
            const tipX = x + sway + offset * 1.8;
            const tipY = height - bladeHeight;
            const midX = x + sway * .45 + offset;
            const midY = height - bladeHeight * .48;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(x + offset * .4, base);
            ctx.quadraticCurveTo(midX - 2, midY, tipX, tipY);
            ctx.quadraticCurveTo(midX + 4, midY + 9, x + offset * .4 + 2, base);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = "rgb(193 224 155 / 38%)";
            ctx.lineWidth = .7;
            ctx.beginPath();
            ctx.moveTo(x + offset * .4 + 1, base - 2);
            ctx.quadraticCurveTo(midX, midY, tipX, tipY);
            ctx.stroke();
          }

          for (let leaf = 0; leaf < 3; leaf++) {
            const t = .28 + leaf * .19;
            const attachX = x + sway * t;
            const attachY = height - heightBase * t;
            const side = (leaf + i) % 2 === 0 ? 1 : -1;
            const length = 11 + (i + leaf) % 8;
            ctx.fillStyle = leaf % 2 ? "#4c996f" : "#629f68";
            ctx.beginPath();
            ctx.moveTo(attachX, attachY);
            ctx.quadraticCurveTo(attachX + side * length * .5, attachY - 5, attachX + side * length, attachY - 14);
            ctx.quadraticCurveTo(attachX + side * length * .5, attachY - 7, attachX + side * 2, attachY + 2);
            ctx.closePath();
            ctx.fill();
          }
        }
      }

      function addBurst(x, y, color, amount = 9) {
        for (let i = 0; i < amount; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 35 + Math.random() * 100;
          particles.push({
            x, y, color,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: .45 + Math.random() * .4,
            maxLife: .85
          });
        }
      }

      function frame(now) {
        const dt = Math.min((now - (lastTime || now)) / 1000, .04);
        const time = now / 1000;
        lastTime = now;
        drawBackground(time, dt);

        while (fish.length < 30) addFish();

        for (let i = fish.length - 1; i >= 0; i--) {
          const item = fish[i];
          item.age += dt;
          item.x += item.speed * item.direction * dt + Math.sin(time * item.frequency + item.phase) * item.amplitude * dt;
          item.y += Math.sin(time * item.verticalFrequency + item.verticalPhase) * item.verticalAmplitude * dt + item.drift * dt;
          if (item.y < item.kind.size) item.drift = Math.abs(item.drift) + 8;
          if (item.y > height - item.kind.size) item.drift = -Math.abs(item.drift) - 8;
          item.y = Math.max(item.kind.size, Math.min(height - item.kind.size, item.y));
          drawFish(item, time);
          if (item.x < -item.kind.size * 2 || item.x > width + item.kind.size * 2 || item.age > 48) {
            fish.splice(i, 1);
          }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.life -= dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vx *= .97;
          p.vy *= .97;
          if (p.life <= 0) { particles.splice(i, 1); continue; }
          ctx.globalAlpha = Math.min(1, p.life / p.maxLife);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 2 + (1 - p.life / p.maxLife) * 2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        for (let i = rewards.length - 1; i >= 0; i--) {
          const reward = rewards[i];
          reward.life -= dt;
          reward.y -= 30 * dt;
          if (reward.life <= 0) { rewards.splice(i, 1); continue; }
          ctx.globalAlpha = Math.min(1, reward.life / .35);
          ctx.fillStyle = "#fff1a7";
          ctx.strokeStyle = "rgb(1 37 55 / 78%)";
          ctx.lineWidth = 3;
          ctx.textAlign = "center";
          ctx.font = "800 16px ui-rounded, system-ui, sans-serif";
          ctx.strokeText(reward.text, reward.x, reward.y);
          ctx.fillText(reward.text, reward.x, reward.y);
        }
        ctx.globalAlpha = 1;
        requestAnimationFrame(frame);
      }

      canvas.addEventListener("pointerdown", event => {
        const rect = canvas.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;
        for (let i = fish.length - 1; i >= 0; i--) {
          const item = fish[i];
          const [hitWidth, hitHeight] = hitboxScale[item.kind.shape] || [1.3, 1];
          const hitX = item.kind.size * hitWidth;
          const hitY = item.kind.size * hitHeight;
          if (Math.abs(x - item.x) <= hitX && Math.abs(y - item.y) <= hitY) {
            item.hp--;
            addBurst(x, y, item.kind.color, item.hp <= 0 ? 13 : 5);
            if (item.hp <= 0) {
              const reward = item.kind.value * (.78 + Math.random() * .44);
              money += reward;
              caught++;
              moneyLabel.textContent = `$${money.toFixed(2)}`;
              rewards.push({ x: item.x, y: item.y - item.kind.size * .45, text: `+$${reward.toFixed(2)}`, life: 1.25 });
              addBurst(item.x, item.y, "#ffe58b", 12);
              fish.splice(i, 1);
            }
            break;
          }
        }
      });

      window.addEventListener("resize", resize);
      resize();
      moneyLabel.textContent = "$0.00";
      for (let i = 0; i < 30; i++) addFish();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
